<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#E3A463"/>
      <stop offset="1" stop-color="#D48B3C"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
      <feBlend mode="multiply"/>
    </filter>
  </defs>
  <rect rx="28" ry="28" width="220" height="220" x="10" y="10" fill="url(#g)"/>
  <g fill="#1b1004" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="92">
    <text x="40" y="120">NC</text>
    <text x="40" y="190">CA</text>
  </g>
  <rect rx="28" ry="28" width="220" height="220" x="10" y="10" fill="none" stroke="#F2E6D0" stroke-opacity="0.22"/>
  <rect width="240" height="240" fill="transparent" filter="url(#grain)"/>
</svg>
